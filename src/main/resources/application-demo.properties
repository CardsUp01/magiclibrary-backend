# =============================================================================
# PROFIL SPRING : DEMO
# =============================================================================
# Ce profil configure l'environnement de démonstration de MagicLibrary.
#
# Il peut être utilisé :
#   - localement avec le profil "demo" ;
#   - sur Railway avec les profils actifs "prod,demo".
#
# Sur Railway, les variables d'environnement sont prioritaires.
# Les valeurs placées après ":" servent uniquement de solutions de repli pour
# une exécution locale.
#
# IMPORTANT :
#   - ce profil est réservé à la démonstration recruteur / portfolio ;
#   - il ne doit jamais être activé sur l'instance CLIENT ;
#   - les composants de réinitialisation exigeront simultanément le profil
#     "demo" et la propriété magiclibrary.demo.reset.enabled=true.
# =============================================================================


# =============================================================================
# APPLICATION
# =============================================================================
# Nom technique exposé par le contexte Spring Boot.
# =============================================================================

spring.application.name=magiclibrary-demo


# =============================================================================
# SERVEUR WEB
# =============================================================================
# Railway fournit automatiquement la variable PORT.
# La valeur 8080 est utilisée uniquement lorsqu'aucun port externe n'est fourni.
# =============================================================================

server.port=${PORT:8080}


# =============================================================================
# BASE DE DONNÉES RELATIONNELLE ? MARIADB
# =============================================================================
# Sur Railway :
#   - DB_URL ;
#   - DB_USERNAME ;
#   - DB_PASSWORD.
#
# En local, les valeurs de repli ciblent la base magiclibrary_demo.
#
# Le profil DEMO ne doit jamais contenir les coordonnées de la future base
# CLIENT.
# =============================================================================

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/magiclibrary_demo?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


# =============================================================================
# JPA / HIBERNATE
# =============================================================================
# Le schéma SQL est géré indépendamment de Hibernate.
#
# Hibernate ne crée, ne modifie et ne supprime aucune table automatiquement.
# La désactivation d'Open Session in View évite les accès tardifs à la base
# depuis la couche de présentation.
# =============================================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect


# =============================================================================
# MONGODB
# =============================================================================
# MongoDB stocke les messages du module CONTACT.
#
# Sur Railway, MONGODB_URI doit cibler exclusivement la base ou le cluster Atlas
# affecté à l'environnement DEMO.
#
# La valeur locale est utilisée uniquement en l'absence de cette variable.
# =============================================================================

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/magiclibrary_demo_nosql}


# =============================================================================
# JWT
# =============================================================================
# La clé JWT doit être fournie par une variable d'environnement sur Railway.
#
# La valeur de repli permet uniquement l'exécution locale du profil DEMO.
# Elle ne doit pas être réutilisée pour l'environnement CLIENT.
#
# Durées :
#   - jeton standard : 24 heures ;
#   - jeton associé à l'option "Se souvenir de moi" : 7 jours.
# =============================================================================

spring.app.jwt.secret=${JWT_SECRET:MagicLibraryDemoLocalJwtSecretKey_2026_ChangeOutsideLocal}
spring.app.jwt.expiration=86400000
spring.app.jwt.expirationRememberMe=604800000


# =============================================================================
# REMEMBER ME
# =============================================================================
# La clé persistante de Remember Me doit être distincte de la clé JWT.
#
# Sur Railway, elle doit être injectée par REMEMBER_ME_KEY.
# =============================================================================

spring.app.security.remember-me.key=${REMEMBER_ME_KEY:MagicLibraryDemoLocalRememberMeKey_2026}


# =============================================================================
# COMPTES SOCLES DE DÉMONSTRATION
# =============================================================================
# Ces identifiants permettent aux initialiseurs DEMO de créer ou de restaurer
# les comptes nécessaires aux scénarios recruteur.
#
# Les mots de passe de démonstration sont volontairement distincts de tout
# compte CLIENT. Ils peuvent être remplacés sur Railway par les variables
# correspondantes.
#
# Ces propriétés conservent leur nom actuel afin de rester compatibles avec les
# initialiseurs existants. Leur migration vers des propriétés Spring
# normalisées sera effectuée lors de la refonte des services DEMO.
# =============================================================================

ADMIN_EMAIL=${DEMO_ADMIN_EMAIL:admin@example.com}
ADMIN_PASSWORD=${DEMO_ADMIN_PASSWORD:Admin123!}
DEMO_MEMBER_PASSWORD=${DEMO_MEMBER_PASSWORD_ENV:Demo123!}


# =============================================================================
# RÉINITIALISATION AUTOMATIQUE DES SCÉNARIOS DEMO
# =============================================================================
# Barrière générale d'activation.
#
# Cette propriété ne suffit jamais seule : les composants correspondants seront
# également protégés par le profil Spring "demo".
# =============================================================================

magiclibrary.demo.reset.enabled=true


# -----------------------------------------------------------------------------
# Reconstruction au démarrage
# -----------------------------------------------------------------------------
# Garantit un état canonique après un démarrage, un redéploiement Railway ou une
# reprise de l'application.
# -----------------------------------------------------------------------------

magiclibrary.demo.reset.startup-enabled=true


# -----------------------------------------------------------------------------
# Surveillance automatique
# -----------------------------------------------------------------------------
# Le scheduler contrôle périodiquement l'intégrité des scénarios.
#
# Il ne réinitialise rien lorsque les données sont déjà conformes.
# -----------------------------------------------------------------------------

magiclibrary.demo.reset.scheduler-enabled=true

# Première vérification différée après le démarrage de l'application.
magiclibrary.demo.reset.initial-delay=PT30S

# Intervalle entre deux contrôles de santé successifs.
magiclibrary.demo.reset.check-interval=PT2M


# -----------------------------------------------------------------------------
# Délai d'inactivité
# -----------------------------------------------------------------------------
# Un scénario dégradé n'est pas reconstruit immédiatement.
#
# Ce délai permet au recruteur d'observer normalement le résultat de ses
# actions avant que la démonstration soit remise dans son état initial.
# -----------------------------------------------------------------------------

magiclibrary.demo.reset.inactivity-delay=PT15M


# -----------------------------------------------------------------------------
# Réinitialisation manuelle
# -----------------------------------------------------------------------------
# Autorise le futur bouton administrateur de secours.
#
# L'accès restera conditionné au profil DEMO, à cette propriété et au rôle
# ADMIN. Le contrôleur ne contiendra aucune logique de suppression.
# -----------------------------------------------------------------------------

magiclibrary.demo.reset.manual-enabled=true


# =============================================================================
# DOCUMENTATION OPENAPI / SWAGGER
# =============================================================================
# Swagger reste désactivé dans l'environnement de démonstration public.
# =============================================================================

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false


# =============================================================================
# GESTION DES ERREURS HTTP
# =============================================================================
# Empêche l'exposition au navigateur des exceptions, traces techniques et
# détails internes de validation.
# =============================================================================

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false


# =============================================================================
# JOURNALISATION
# =============================================================================
# Niveau adapté à une démonstration publique :
#   - événements applicatifs visibles ;
#   - requêtes SQL et paramètres sensibles masqués ;
#   - traces de sécurité limitées au niveau INFO.
#
# Les futurs composants DEMO journaliseront explicitement les contrôles,
# déclenchements, réussites, échecs partiels et refus de concurrence.
# =============================================================================

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF