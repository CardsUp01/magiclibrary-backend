# ============================================================================
# APPLICATION
# ============================================================================
# Nom technique de l'application Spring Boot.
# Utilisé pour identifier le service dans les logs et environnements cloud.
# ============================================================================

spring.application.name=magiclibrary

# ============================================================================
# SERVEUR WEB
# ============================================================================
# Railway injecte automatiquement la variable d'environnement PORT.
# La valeur 8080 sert uniquement de fallback local si PORT est absent.
# ============================================================================

server.port=${PORT:8080}

# ============================================================================
# BASE DE DONNÉES RELATIONNELLE MYSQL (PRODUCTION RAILWAY)
# ============================================================================
# Connexion sécurisée à la base relationnelle MySQL hébergée sur Railway.
# Toutes les valeurs sensibles sont injectées via variables d'environnement
# afin d'éviter toute exposition dans le code source.
#
# Le pilote JDBC n'est pas imposé explicitement.
# Spring Boot le sélectionne automatiquement à partir de DB_URL :
#   - jdbc:mysql:     -> MySQL Connector/J ;
#   - jdbc:mariadb:   -> MariaDB Connector/J.
# ============================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ============================================================================
# JPA / HIBERNATE - STRATÉGIE DE SCHÉMA
# ============================================================================
#
# CONTEXTE RAILWAY :
# ddl-auto=update permet à Hibernate de :
#   - créer automatiquement les tables manquantes sur une base Railway vide ;
#   - adapter le schéma aux entités Java ;
#   - éviter les crashs de démarrage liés aux tables absentes.
#
# NOTE PRODUCTION AVANCÉE :
# Pour une production industrielle, cette stratégie serait remplacée par
# Flyway ou Liquibase afin de versionner strictement les migrations SQL.
#
# IMPORTANT :
# Le dialecte Hibernate n'est pas déclaré explicitement.
# Hibernate 6 le détecte automatiquement via le pilote JDBC réellement choisi.
# Cela évite de forcer un dialecte MariaDB sur une base MySQL Railway.
# ============================================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================================
# MONGODB (MODULE CONTACT)
# ============================================================================
# Base NoSQL dédiée au module de contact utilisateur.
# Indépendante de la base relationnelle MySQL.
# ============================================================================

spring.data.mongodb.uri=${MONGODB_URI}

# ============================================================================
# JWT - AUTHENTIFICATION
# ============================================================================
# Configuration de sécurité pour l'authentification stateless.
# Tokens utilisés pour sécuriser les endpoints REST.
#
# expiration : durée de validité standard de 24 heures ;
# remember-me : durée étendue de 7 jours.
# ============================================================================

spring.app.jwt.secret=${JWT_SECRET}
spring.app.jwt.expiration=${JWT_EXPIRATION:86400000}
spring.app.jwt.expirationRememberMe=${JWT_EXPIRATION_REMEMBER_ME:604800000}

# ============================================================================
# REMEMBER ME (SPRING SECURITY)
# ============================================================================
# Clé utilisée pour maintenir une session utilisateur persistante.
# ============================================================================

spring.app.security.remember-me.key=${REMEMBER_ME_KEY}

# ============================================================================
# SPRING BOOT ACTUATOR - HEALTHCHECK TECHNIQUE
# ============================================================================
# Expose exclusivement l'endpoint technique de santé :
#
#   GET /actuator/health
#
# Cet endpoint sera utilisé par Railway afin de vérifier qu'un nouveau
# déploiement répond correctement avant de le considérer comme opérationnel.
#
# Aucun endpoint sensible tel que env, beans, mappings, configprops ou metrics
# n'est exposé par cette configuration.
#
# Les détails internes et les composants du healthcheck restent masqués afin
# d'éviter toute fuite d'information sur l'infrastructure applicative.
#
# L'autorisation HTTP publique de /actuator/health est également limitée dans
# SecurityConfig. Les autres chemins restent soumis aux règles de sécurité.
# ============================================================================

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# ============================================================================
# DOCUMENTATION API (PRODUCTION)
# ============================================================================
# Désactivation de Swagger afin d'éviter l'exposition publique des endpoints
# et de leur documentation dans les environnements de production.
# ============================================================================

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ============================================================================
# LOGGING (PRODUCTION OPTIMISÉ)
# ============================================================================
# Réduction du bruit des journaux et limitation des informations techniques :
# - aucune requête SQL affichée ;
# - aucun paramètre SQL affiché ;
# - réduction des logs MongoDB très verbeux ;
# - masquage du warning Spring Security connu lorsque l'architecture
#   d'authentification est volontairement configurée.
# ============================================================================

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

logging.level.org.mongodb.driver=ERROR

logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ============================================================================
# GESTION DES ERREURS (SÉCURITÉ)
# ============================================================================
# Empêche la fuite d'informations sensibles dans les réponses HTTP envoyées
# aux utilisateurs ou aux clients techniques.
# ============================================================================

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false